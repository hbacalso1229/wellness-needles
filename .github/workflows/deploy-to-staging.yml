name: Deploy — Staging

# Runs after CI succeeds on dev.
# Deploys a Vercel Preview deployment, then aliases it to the stable staging
# hostname: https://wellness-needles.vercel.app
# Also supports manual runs via workflow_dispatch.

on:
  workflow_run:
    workflows: [Check — Quality]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# workflow_run.branches / head_branch use the PR head, so a Quality run for a
# `dev` → `main` PR looks like a `dev` run. Only follow Quality from a push.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy_staging:
    name: Build & Deploy to Staging (Vercel Preview)
    # Only deploy when Quality succeeded on a push to `dev` (or manual dispatch).
    # Do not promote `main` merges, or PRs from `dev` (including `dev` → `main`),
    # to the staging alias. workflow_run.head_branch is the PR head, not the base.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

      - name: Build static export for staging
        env:
          # Marketing /admin removed for Phase 1 — contact-config defaults + env Web3Forms key
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          NEXT_PUBLIC_CAPTCHA_PROVIDER: hcaptcha
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          VERCEL_GIT_COMMIT_REF: dev
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html
          test ! -d out/admin

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Deploy the static `out/` folder directly. `vercel build --prebuilt` has been
      # serving Next 404s for exported routes (including /bookings/thank-you/).
      # Copy `.vercel` so we deploy into the existing project (not a new "out" project).
      # --archive=tgz is required: repo .gitignore has /out/, so a normal deploy
      # uploads almost nothing (~5KB) and Vercel serves 404 NOT_FOUND.
      #
      # Stable staging hostname: wellness-needles.vercel.app (not ephemeral preview URLs).
      # Do not use --prod here — production is Cloudflare Pages via GitHub Release.
      - name: Deploy static export to Vercel (preview / staging)
        id: deploy
        env:
          STAGING_HOST: wellness-needles.vercel.app
        run: |
          set -euo pipefail
          cp -R .vercel out/.vercel
          cp vercel.json out/vercel.json
          deployment=$(vercel deploy --cwd out --archive=tgz --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          vercel alias set "$deployment" "$STAGING_HOST" --token=${{ secrets.VERCEL_TOKEN }}
          echo "url=https://${STAGING_HOST}" >> "$GITHUB_OUTPUT"

      - name: Verify staging site responds
        run: |
          set -euo pipefail
          dep="${{ steps.deploy.outputs.deployment }}"
          base="${{ steps.deploy.outputs.url }}"

          # Deployment URL first (authoritative — do not wait on alias CDN).
          dep_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/")
          echo "HTTP $dep_code → ${dep}/"
          test "$dep_code" = "200"

          for path in bookings/ bookings/thank-you/ bookings/unable-to-process/; do
            pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/${path}")
            echo "HTTP $pcode → ${dep}/${path}"
            test "$pcode" = "200"
          done

          # Alias can briefly 404 on nested routes while CDN updates — retry.
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${base}/" || true)
            echo "Attempt $i: HTTP $code → ${base}/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"

          for path in bookings/ bookings/thank-you/ bookings/unable-to-process/; do
            pcode="000"
            for i in 1 2 3 4 5 6; do
              pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${base}/${path}" || true)
              echo "Attempt $i: HTTP $pcode → ${base}/${path}"
              if [ "$pcode" = "200" ]; then
                break
              fi
              sleep 5
            done
            test "$pcode" = "200"
          done

          admin_code="000"
          for i in 1 2 3 4; do
            admin_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${base}/admin/" || true)
            echo "Attempt $i: HTTP $admin_code → ${base}/admin/ (expect 404)"
            if [ "$admin_code" = "404" ]; then
              break
            fi
            sleep 3
          done
          test "$admin_code" = "404"

      - name: Print staging URL
        run: |
          echo "Staging deployment → ${{ steps.deploy.outputs.deployment }}"
          echo "Staging URL → ${{ steps.deploy.outputs.url }}"
          echo "Note: patient Resend thank-you runs on Cloudflare production only; staging still sends clinic Web3Forms mail."
