name: Deploy — Staging

# Runs after CI succeeds on dev.
# Deploys a Vercel Preview deployment (acts as staging).
# Also supports manual runs via workflow_dispatch.

on:
  workflow_run:
    workflows: [Check — Quality]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Build & Deploy to Staging (Vercel Preview)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

      - name: Build static export for staging
        env:
          # Admin nav + /admin tooling only on staging (dev branch)
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "true"
          # Baked into static client at build time (GitHub secret)
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          VERCEL_GIT_COMMIT_REF: dev
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Deploy the static `out/` folder directly. `vercel build --prebuilt` has been
      # serving Next 404s for exported routes (including /bookings/thank-you/).
      # Copy `.vercel` so we deploy into the existing project (not a new "out" project).
      # --archive=tgz is required: repo .gitignore has /out/, so a normal deploy
      # uploads almost nothing (~5KB) and Vercel serves 404 NOT_FOUND.
      - name: Deploy static export to Vercel (preview / staging)
        id: deploy
        run: |
          cp -R .vercel out/.vercel
          cp vercel.json out/vercel.json
          url=$(vercel deploy --cwd out --archive=tgz --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Verify staging site responds
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${{ steps.deploy.outputs.url }}/")
          echo "HTTP $code → ${{ steps.deploy.outputs.url }}/"
          test "$code" = "200"

      - name: Print staging URL
        run: echo "Staging URL → ${{ steps.deploy.outputs.url }}"
