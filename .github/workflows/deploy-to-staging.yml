name: Deploy — Staging

# Runs after CI succeeds on dev.
# Deploys a Vercel Preview deployment (acts as staging).
# Also supports manual runs via workflow_dispatch.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Build & Deploy to Staging (Vercel Preview)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (via Vercel)
        env:
          # Admin nav + /admin tooling only on staging (dev branch)
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "true"
          VERCEL_GIT_COMMIT_REF: dev
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview / staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Print staging URL
        run: echo "Staging URL → ${{ steps.deploy.outputs.url }}"
