name: Create Production Release

# Publishes the next GitHub Release from main HEAD (tag vX.Y.Z, title "Release vX.Y.Z"),
# then starts Deploy — Production. GITHUB_TOKEN cannot fire the `release` event, so this
# workflow dispatches deploy explicitly. Do not run this on merge.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  create_release:
    name: Tag next vX.Y.Z and publish notes
    runs-on: ubuntu-latest

    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch (Actions → Run workflow → Use workflow from: main)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force origin

      - name: Verify Check — Quality succeeded on HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list \
            --workflow "Check — Quality" \
            --commit "${sha}" \
            --json conclusion,event,status \
            --jq '[.[] | select(.event == "push" and .status == "completed")] | .[0].conclusion // empty')"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Check — Quality has not succeeded on ${sha} (got ${conclusion:-none}). Merge to main and wait for CI before releasing."
            exit 1
          fi
          echo "Quality OK on ${sha}"

      - name: Create Release vX.Y.Z
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          prev="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "${prev}" ]; then
            tag="v1.0.0"
          else
            ver="${prev#v}"
            IFS=. read -r major minor patch <<< "${ver}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          title="Release ${tag}"

          notes="$(printf '```\nProduction: https://www.wellnessneedles.ie\nCommit: %s\n```\n' "${sha}")"

          echo "Creating ${title} (tag ${tag}) at ${sha} (notes from ${prev:-beginning})"

          create_args=(
            "${tag}"
            --target "${sha}"
            --title "${title}"
            --generate-notes
            --notes "${notes}"
          )
          if [ -n "${prev}" ]; then
            create_args+=(--notes-start-tag "${prev}")
          fi

          gh release create "${create_args[@]}"

          echo "${title} → https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

          # GITHUB_TOKEN release publishes do not start other workflows.
          gh workflow run "Deploy — Production" --ref main -f "tag=${tag}"
          echo "Started Deploy — Production for ${tag}."
