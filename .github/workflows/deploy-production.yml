name: Deploy — Production

# Production goes live ONLY when a GitHub Release is published.
# Merging to main runs CI quality checks only — it does not deploy.
# Prefer Direct Upload via this workflow (do not connect Cloudflare GitHub auto-deploy).

on:
  release:
    types: [published]

jobs:
  deploy_production:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.wellnessneedles.ie

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

      - name: Build static export for production
        env:
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          # Restore the pre-Turnstile path: browser → Web3Forms (same as staging).
          # Turnstile + /api/booking-request caused email+apology (Function slower than the 15s abort).
          NEXT_PUBLIC_CAPTCHA_PROVIDER: hcaptcha
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION }}
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html
          test -f out/_redirects
          test ! -d out/admin
          test -f functions/api/booking-thank-you.ts
          test -f functions/api/booking-request.ts

      - name: Guard clinic send is hCaptcha, not Turnstile
        env:
          PROD_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if grep -E 'NEXT_PUBLIC_CAPTCHA_PROVIDER:[[:space:]]*turnstile' .github/workflows/deploy-production.yml; then
            echo "::error::deploy-production.yml must not bake Turnstile. That path showed apology after clinic mail."
            exit 1
          fi
          if ! grep -E 'NEXT_PUBLIC_CAPTCHA_PROVIDER:[[:space:]]*hcaptcha' .github/workflows/deploy-production.yml; then
            echo "::error::deploy-production.yml must bake NEXT_PUBLIC_CAPTCHA_PROVIDER=hcaptcha."
            exit 1
          fi
          if [ -z "${PROD_WEB3FORMS_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION is empty. www would fail isBookingEmailConfigured and show the apology page."
            exit 1
          fi
          if grep -R -F -q '0x4AAAAAAEPCqhDUf9aLTuLx' out/_next; then
            echo "::error::Turnstile sitekey is baked into the production export. Clinic send would use /api/booking-request again."
            exit 1
          fi
          echo "Production export: hCaptcha path, Web3Forms key present, no Turnstile sitekey."

      # Pages Production secrets (Settings → Variables and secrets):
      #   RESEND_API_KEY (patient thank-you). TURNSTILE_* unused for clinic send.
      # (Avoids wrangler pages secret put, which needs extra User Memberships permissions.)

      - name: Prefight Cloudflare auth (Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set (repo AND Environment 'production' if used)."
            exit 1
          fi
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/wellness-needles")
          echo "GET pages project HTTP $code"
          cat /tmp/cf-pages.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare token cannot read Pages project wellness-needles (HTTP $code)."
            echo "Create a User API Token from Edit Cloudflare Workers template with:"
            echo "  - Account → Cloudflare Pages → Edit"
            echo "  - Account → Account Settings → Read"
            echo "  - User → Memberships → Read"
            echo "Paste into GitHub secret CLOUDFLARE_API_TOKEN (also under Environments → production if that env overrides repo secrets)."
            echo "Confirm CLOUDFLARE_ACCOUNT_ID=83b6ef26740280d458165b62fe503553"
            exit 1
          fi
          echo "Cloudflare Pages auth OK"

      - name: Deploy static export + Functions to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Releases check out a tag (detached HEAD). Without an explicit branch,
          # wrangler may create a preview alias (e.g. head.*.pages.dev) that custom
          # domains do NOT serve. Force the project production branch.
          deploy_log=$(mktemp)
          npx wrangler@4 pages deploy out \
            --project-name=wellness-needles \
            --branch=main \
            --commit-dirty=true | tee "$deploy_log"
          # Prefer production project URL; fall back to any pages.dev URL from the log.
          deployment="https://wellness-needles.pages.dev"
          logged=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$deploy_log" | tail -n 1 || true)
          if [ -n "$logged" ]; then
            echo "Wrangler reported: $logged"
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "url=https://www.wellnessneedles.ie" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare deployment responds
        run: |
          set -euo pipefail
          dep="${{ steps.deploy.outputs.deployment }}"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "${dep}/" || true)
            echo "Attempt $i: HTTP $code → ${dep}/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"

          for path in bookings/ bookings/thank-you/ bookings/unable-to-process/; do
            pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/${path}")
            echo "HTTP $pcode → ${dep}/${path}"
            test "$pcode" = "200"
          done

      - name: Verify canonical www (best-effort with retries)
        run: |
          set -euo pipefail
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "https://www.wellnessneedles.ie/" || true)
            echo "Attempt $i: HTTP $code → https://www.wellnessneedles.ie/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 8
          done
          if [ "$code" != "200" ]; then
            echo "::warning::www.wellnessneedles.ie is not 200 yet (got $code). Deployment URL is healthy — check Cloudflare custom domain / SSL."
          else
            echo "Canonical www OK"
          fi

      - name: Print production URL
        run: |
          echo "Cloudflare deployment → ${{ steps.deploy.outputs.deployment }}"
          echo "Production URL → https://www.wellnessneedles.ie"
          echo "Staging stays on → https://wellness-needles.vercel.app"
