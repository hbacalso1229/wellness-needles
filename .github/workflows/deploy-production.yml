name: Deploy — Production

# Runs after CI succeeds on main (merge / push).
# Also supports manual trigger via workflow_dispatch for hotfixes.
# Add required reviewers in: Repo Settings → Environments → production
# to enforce a manual approval gate before production deploys.

on:
  workflow_run:
    workflows: [Check — Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_production:
    name: Build & Deploy to Production (Vercel)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

      - name: Build static export for production
        env:
          # Hide Admin on production (main branch); legacy form stays the default
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          # Baked into static client at build time (GitHub secret)
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          VERCEL_GIT_COMMIT_REF: main
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --archive=tgz is required: repo .gitignore has /out/, so a normal deploy
      # uploads almost nothing (~5KB) and Vercel serves 404 NOT_FOUND.
      #
      # Use --prod so Vercel assigns production domains (wellnessneedles.ie + www).
      # --prod also reclaims wellness-needles.vercel.app, so the next step restores
      # that hostname to the last known staging deployment.
      - name: Deploy static export to Vercel (production)
        id: deploy
        run: |
          set -euo pipefail
          cp -R .vercel out/.vercel
          cp vercel.json out/vercel.json
          deployment=$(vercel deploy --cwd out --archive=tgz --yes --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "url=https://wellnessneedles.ie" >> "$GITHUB_OUTPUT"

      - name: Verify production site responds
        run: |
          set -euo pipefail
          # Always verify the deployment URL (custom domain may wait on DNS/TLS).
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${{ steps.deploy.outputs.deployment }}/")
          echo "HTTP $code → ${{ steps.deploy.outputs.deployment }}/"
          test "$code" = "200"

      - name: Restore staging alias after --prod
        env:
          STAGING_HOST: wellness-needles.vercel.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROD_DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          # --prod reclaims wellness-needles.vercel.app. Prefer a preview that actually
          # has Admin tooling (our staging builds), not an arbitrary GitHub preview.
          prod_host="${PROD_DEPLOYMENT#https://}"
          prod_host="${prod_host%/}"
          mapfile -t candidates < <(curl -sS \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=30" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            | jq -r --arg prod "$prod_host" '
              .deployments[]
              | select((.readyState == "READY" or .state == "READY")
                and (.target != "production")
                and .url
                and .url != $prod)
              | .url
            ')

          staging_url=""
          for host in "${candidates[@]}"; do
            echo "Checking candidate https://${host}/admin/ …"
            html=$(curl -sS --max-time 20 "https://${host}/admin/" || true)
            if echo "$html" | grep -qE 'Booking feature|Legacy stepper|Fresha booking|Calendly'; then
              staging_url="https://${host}"
              echo "Selected staging candidate: ${staging_url}"
              break
            fi
          done

          if [ -z "$staging_url" ]; then
            echo "::error::Could not find an Admin-enabled staging preview. Run Deploy — Staging first."
            exit 1
          fi

          echo "Restoring ${STAGING_HOST} → ${staging_url}"
          vercel alias set "$staging_url" "$STAGING_HOST" --token="${VERCEL_TOKEN}"

          code="000"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://${STAGING_HOST}/" || true)
            echo "Attempt $i: HTTP $code → https://${STAGING_HOST}/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"

          admin_html=$(curl -sS --max-time 30 "https://${STAGING_HOST}/admin/")
          if echo "$admin_html" | grep -qE 'Booking feature|Legacy stepper|Fresha booking|Calendly'; then
            echo "Staging alias restored with Admin tooling — OK"
          else
            echo "::error::Staging alias restore did not serve Admin tooling. Run Deploy — Staging, then re-run production."
            exit 1
          fi

          prod_admin=$(curl -sS --max-time 30 "${PROD_DEPLOYMENT}/admin/")
          if echo "$prod_admin" | grep -q 'Admin unavailable'; then
            echo "Production deployment keeps Admin unavailable — OK"
          else
            echo "::error::Production deployment unexpectedly exposes Admin tooling."
            exit 1
          fi

      - name: Print production URL
        run: |
          echo "Production deployment → ${{ steps.deploy.outputs.deployment }}"
          echo "Production URL → ${{ steps.deploy.outputs.url }}"
          echo "Staging URL → https://wellness-needles.vercel.app"
