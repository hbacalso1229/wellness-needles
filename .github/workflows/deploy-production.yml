name: Deploy — Production

# Runs after CI succeeds on main (merge / push).
# Also supports manual trigger via workflow_dispatch for hotfixes.
# Add required reviewers in: Repo Settings → Environments → production
# to enforce a manual approval gate before production deploys.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy_production:
    name: Build & Deploy to Production (Vercel)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

      - name: Build static export for production
        env:
          # Hide Admin on production (main branch); legacy form stays the default
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          # Baked into static client at build time (GitHub secret)
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          VERCEL_GIT_COMMIT_REF: main
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy static export to Vercel (production)
        id: deploy
        run: |
          cp vercel.json out/vercel.json
          url=$(vercel deploy ./out --yes --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Print production URL
        run: echo "Production URL → ${{ steps.deploy.outputs.url }}"
