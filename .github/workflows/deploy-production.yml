name: Deploy — Production

# Production goes live ONLY when a GitHub Release is published.
# Merging to main runs CI quality checks only — it does not deploy.
# Prefer Direct Upload via this workflow (do not connect Cloudflare GitHub auto-deploy).

on:
  release:
    types: [published]

jobs:
  deploy_production:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.wellnessneedles.ie

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

      - name: Build static export for production
        env:
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION }}
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html
          test -f out/_redirects
          test ! -d out/admin
          test -f functions/api/booking-thank-you.ts

      - name: Sync Resend secret to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "RESEND_API_KEY secret is required"
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler@4 pages secret put RESEND_API_KEY --project-name=wellness-needles

      - name: Deploy static export + Functions to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Capture deployment URL so we can verify even if custom-domain SSL is still settling.
          deploy_log=$(mktemp)
          npx wrangler@4 pages deploy out \
            --project-name=wellness-needles \
            --commit-dirty=true | tee "$deploy_log"
          deployment=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$deploy_log" | tail -n 1 || true)
          if [ -z "$deployment" ]; then
            deployment="https://wellness-needles.pages.dev"
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "url=https://www.wellnessneedles.ie" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare deployment responds
        run: |
          set -euo pipefail
          dep="${{ steps.deploy.outputs.deployment }}"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "${dep}/" || true)
            echo "Attempt $i: HTTP $code → ${dep}/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"

          for path in bookings/ bookings/thank-you/ bookings/unable-to-process/; do
            pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/${path}")
            echo "HTTP $pcode → ${dep}/${path}"
            test "$pcode" = "200"
          done

      - name: Verify canonical www (best-effort with retries)
        run: |
          set -euo pipefail
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "https://www.wellnessneedles.ie/" || true)
            echo "Attempt $i: HTTP $code → https://www.wellnessneedles.ie/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 8
          done
          if [ "$code" != "200" ]; then
            echo "::warning::www.wellnessneedles.ie is not 200 yet (got $code). Deployment URL is healthy — check Cloudflare custom domain / SSL."
          else
            echo "Canonical www OK"
          fi

      - name: Print production URL
        run: |
          echo "Cloudflare deployment → ${{ steps.deploy.outputs.deployment }}"
          echo "Production URL → https://www.wellnessneedles.ie"
          echo "Staging stays on → https://wellness-needles.vercel.app"
