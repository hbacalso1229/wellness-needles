name: Deploy — Production

# Production goes live when a GitHub Release is published (GitHub UI)
# or when Create Production Release dispatches this workflow with a tag.
# Merging to main runs CI quality checks only — it does not deploy.
# Prefer Direct Upload via this workflow (do not connect Cloudflare GitHub auto-deploy).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy (e.g. v1.1.4)
        required: true
        type: string

jobs:
  deploy_production:
    name: Build & Deploy to Cloudflare Pages
    # Ignore non-semver tags (e.g. Release-1). Manual UI publishes and
    # Create Production Release both pass a vX.Y.Z tag.
    if: >
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.wellnessneedles.ie

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

      - name: Build static export for production
        env:
          NEXT_PUBLIC_ADMIN_UI_ENABLED: "false"
          # Overlay kill switch. "true" allows www to fetch /api/bff/site (owner
          # must still Publish overlay on). Set to "false" and Release to restore
          # baked www + booking Functions only (no /api/bff).
          NEXT_PUBLIC_SITE_OVERLAY_ENABLED: "true"
          # Turnstile widget + /api/booking-request. Client must not abort this fetch
          # (a 15s timeout previously showed apology after clinic mail had already sent).
          NEXT_PUBLIC_CAPTCHA_PROVIDER: turnstile
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAEPCqhDUf9aLTuLx"
          # Country lock: hide phone country picker, keep +353.
          NEXT_PUBLIC_STRICT_IRISH_PHONE: "true"
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION }}
        run: npx next build

      - name: Verify booking result routes exist in export
        run: |
          test -f out/bookings/thank-you/index.html
          test -f out/bookings/unable-to-process/index.html
          test -f out/bookings/index.html
          test -f out/_redirects
          test ! -d out/admin
          test -f functions/api/booking-thank-you.ts
          test -f functions/api/booking-request.ts
          test -f functions/api/booking-captcha.ts
          test -f functions/api/review-submit.ts
          test -f functions/api/reviews.ts

      - name: Guard clinic send is Turnstile + Function
        env:
          PROD_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if ! grep -E 'NEXT_PUBLIC_CAPTCHA_PROVIDER:[[:space:]]*turnstile' .github/workflows/deploy-production.yml; then
            echo "::error::deploy-production.yml must bake NEXT_PUBLIC_CAPTCHA_PROVIDER=turnstile."
            exit 1
          fi
          if ! grep -E 'NEXT_PUBLIC_STRICT_IRISH_PHONE:[[:space:]]*"true"' .github/workflows/deploy-production.yml; then
            echo "::error::deploy-production.yml must bake NEXT_PUBLIC_STRICT_IRISH_PHONE=true."
            exit 1
          fi
          overlay_true=$(grep -cE 'NEXT_PUBLIC_SITE_OVERLAY_ENABLED:[[:space:]]*"true"' .github/workflows/deploy-production.yml || true)
          overlay_false=$(grep -cE 'NEXT_PUBLIC_SITE_OVERLAY_ENABLED:[[:space:]]*"false"' .github/workflows/deploy-production.yml || true)
          if [ "$overlay_true" != "0" ] && [ "$overlay_false" != "0" ]; then
            echo "::error::NEXT_PUBLIC_SITE_OVERLAY_ENABLED must be the same value everywhere in deploy-production.yml."
            exit 1
          fi
          if [ "$overlay_false" != "0" ]; then
            if ! grep -F "NEXT_PUBLIC_SITE_OVERLAY_ENABLED !== 'false'" scripts/pages-deploy-subset.mjs; then
              echo "::error::www subset deploy must skip /api/bff when NEXT_PUBLIC_SITE_OVERLAY_ENABLED=false."
              exit 1
            fi
            echo "Overlay kill switch off: www deploys booking Functions only."
          elif [ "$overlay_true" != "0" ]; then
            test -f functions/api/bff/site.ts
            test -f functions/api/bff/booking-persist.ts
            test -f "functions/api/bff/insurance-logo/[id].ts"
            if ! grep -F "join(functionsDest, 'bff')" scripts/pages-deploy-subset.mjs; then
              echo "::error::www subset deploy must upload /api/bff/site when overlay is on."
              exit 1
            fi
            echo "Overlay kill switch on: www may upload public BFF."
          else
            echo "::error::deploy-production.yml must bake NEXT_PUBLIC_SITE_OVERLAY_ENABLED as \"true\" or \"false\"."
            exit 1
          fi
          if [ -z "${PROD_WEB3FORMS_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY_PRODUCTION is empty (kept for hCaptcha rollback)."
            exit 1
          fi
          if ! grep -R -F -q '0x4AAAAAAEPCqhDUf9aLTuLx' out/_next; then
            echo "::error::Turnstile sitekey missing from the production export."
            exit 1
          fi
          echo "Production export: Turnstile default + hCaptcha rollback key/sitekey baked."

      # Pages Production (Settings → Variables and secrets):
      #   Secrets: RESEND_API_KEY, TURNSTILE_SECRET_KEY, WEB3FORMS_ACCESS_KEY
      #   Text: BOOKING_CAPTCHA_PROVIDER = turnstile | hcaptcha (runtime rollback, no Release)
      # (Avoids wrangler pages secret put, which needs extra User Memberships permissions.)

      - name: Prefight Cloudflare auth (Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set (repo AND Environment 'production' if used)."
            exit 1
          fi
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/wellness-needles")
          echo "GET pages project HTTP $code"
          cat /tmp/cf-pages.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare token cannot read Pages project wellness-needles (HTTP $code)."
            echo "Create a User API Token from Edit Cloudflare Workers template with:"
            echo "  - Account → Cloudflare Pages → Edit"
            echo "  - Account → Account Settings → Read"
            echo "  - User → Memberships → Read"
            echo "Paste into GitHub secret CLOUDFLARE_API_TOKEN (also under Environments → production if that env overrides repo secrets)."
            echo "Confirm CLOUDFLARE_ACCOUNT_ID=83b6ef26740280d458165b62fe503553"
            exit 1
          fi
          echo "Cloudflare Pages auth OK"

      - name: Deploy static export + Functions to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the build-step bake so www BFF upload stays in lockstep.
          NEXT_PUBLIC_SITE_OVERLAY_ENABLED: "true"
        run: |
          set -euo pipefail
          # Releases check out a tag (detached HEAD). Without an explicit branch,
          # wrangler may create a preview alias (e.g. head.*.pages.dev) that custom
          # domains do NOT serve. Force the project production branch.
          deploy_log=$(mktemp)
          node scripts/pages-deploy-subset.mjs www | tee "$deploy_log"
          # Prefer production project URL; fall back to any pages.dev URL from the log.
          deployment="https://wellness-needles.pages.dev"
          logged=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$deploy_log" | tail -n 1 || true)
          if [ -n "$logged" ]; then
            echo "Wrangler reported: $logged"
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "url=https://www.wellnessneedles.ie" >> "$GITHUB_OUTPUT"

      - name: Deploy owner portal (non-blocking)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm --prefix portal ci
          npm --prefix portal run build
          node scripts/pages-deploy-subset.mjs portal

      - name: Deploy reminder Cron Worker (non-blocking)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 deploy --config workers/booking-reminders/wrangler.toml

      - name: Verify Cloudflare deployment responds
        run: |
          set -euo pipefail
          dep="${{ steps.deploy.outputs.deployment }}"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "${dep}/" || true)
            echo "Attempt $i: HTTP $code → ${dep}/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$code" = "200"

          for path in bookings/ bookings/thank-you/ bookings/unable-to-process/; do
            pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/${path}")
            echo "HTTP $pcode → ${dep}/${path}"
            test "$pcode" = "200"
          done

          if grep -qE 'NEXT_PUBLIC_SITE_OVERLAY_ENABLED:[[:space:]]*"true"' .github/workflows/deploy-production.yml; then
            bcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${dep}/api/bff/site" || true)
            echo "HTTP $bcode → ${dep}/api/bff/site"
            test "$bcode" = "200"
          fi

      - name: Verify canonical www (best-effort with retries)
        run: |
          set -euo pipefail
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "https://www.wellnessneedles.ie/" || true)
            echo "Attempt $i: HTTP $code → https://www.wellnessneedles.ie/"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 8
          done
          if [ "$code" != "200" ]; then
            echo "::warning::www.wellnessneedles.ie is not 200 yet (got $code). Deployment URL is healthy — check Cloudflare custom domain / SSL."
          else
            echo "Canonical www OK"
          fi

      - name: Print production URL
        run: |
          echo "Cloudflare deployment → ${{ steps.deploy.outputs.deployment }}"
          echo "Production URL → https://www.wellnessneedles.ie"
          echo "Staging stays on → https://wellness-needles.vercel.app"
