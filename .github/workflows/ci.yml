name: Check — Quality

# Runs on every PR and on pushes to dev/main.
# Acts as the quality gate — no deployment here.
# After a successful push to `dev`, starts Deploy — Staging.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  quality:
    name: Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Build for E2E (no Web3Forms / captcha)
        run: npm run build:e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps runs apt against azure.archive.ubuntu.com and can hang
      # for 30–50+ minutes when that mirror stalls. Install browsers without
      # apt; ubuntu-latest already has Chromium system libraries. OS deps are
      # best-effort with a short timeout so a stuck mirror cannot block CI.
      - name: Install Playwright OS deps
        timeout-minutes: 2
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        timeout-minutes: 3
        run: npx playwright install chromium

      - name: End-to-end tests
        timeout-minutes: 3
        run: npm run test:e2e

      - name: Build portal export
        run: npm run build:portal

      - name: Portal end-to-end tests
        timeout-minutes: 4
        run: npm run test:e2e:portal

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-portal/
          retention-days: 7

      - name: Start staging deploy
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-to-staging.yml --ref dev -f sha="${{ github.sha }}"
